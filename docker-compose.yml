version: '3.8'

services:
  astra-geo-mapper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: astra-geo-mapper
    ports:
      - "8080:8080"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /run
      - /tmp
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.astra-geo-mapper.rule=Host(`astra-geo-mapper.local`)"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
