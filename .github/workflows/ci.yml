name: CI Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-scan:
    name: Security and Quality Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for secret detection

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install detect-secrets pre-commit

      - name: Run detect-secrets
        run: |
          detect-secrets scan --baseline .secrets.baseline
          detect-secrets audit .secrets.baseline --report --json

      - name: Check for new secrets
        run: |
          if detect-secrets scan --baseline .secrets.baseline | grep -q "new secrets"; then
            echo "❌ New secrets detected! Please review and update .secrets.baseline"
            exit 1
          fi

      - name: Validate HTML files
        run: |
          # Check if HTML files are valid
          for file in *.html; do
            if [ -f "$file" ]; then
              echo "Checking $file..."
              # Basic validation - check for common issues
              if grep -q "<script.*innerHTML" "$file"; then
                echo "⚠️  Warning: Found innerHTML usage in $file"
              fi
            fi
          done

      - name: Check file sizes
        run: |
          # Ensure no large files are committed
          find . -type f -size +1M ! -path "./.git/*" ! -path "./node_modules/*" | while read file; do
            echo "⚠️  Large file detected: $file"
          done

      - name: Security headers check
        run: |
          # Check if secure version has security headers
          if [ -f "astra_geo_mapper_secure.html" ]; then
            if ! grep -q "Content-Security-Policy" astra_geo_mapper_secure.html; then
              echo "❌ Missing CSP header in secure version"
              exit 1
            fi
            if ! grep -q "integrity=" astra_geo_mapper_secure.html; then
              echo "⚠️  Warning: Missing SRI in secure version"
            fi
          fi

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: astra-geo-mapper:test
          cache-from: type=registry,ref=astra-geo-mapper:buildcache
          cache-to: type=inline

      - name: Test Docker container
        run: |
          docker run -d --name test-container -p 8080:80 astra-geo-mapper:test
          sleep 5
          # Test if container is running
          if ! docker ps | grep -q test-container; then
            echo "❌ Container failed to start"
            exit 1
          fi
          # Test if web server responds
          if ! curl -f http://localhost:8080 > /dev/null 2>&1; then
            echo "❌ Web server not responding"
            exit 1
          fi
          docker stop test-container
          docker rm test-container
          echo "✅ Docker container test passed"

  lint-and-format:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pre-commit
        run: |
          pip install pre-commit

      - name: Run pre-commit
        run: |
          pre-commit run --all-files
